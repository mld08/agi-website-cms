{% for r in items %}        <a class="rs-pub" href="../assets/{{ r.pdf_file }}" target="_blank" rel="noopener">
          <span class="rs-pub-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 3v5h5"></path><path d="M7 3h7l5 5v13H7z"></path></svg></span>
          <span class="rs-pub-main">
            <h3>{{ r.title }}</h3>
            <p>{{ r.subtitle }}</p>
          </span>
          <span class="rs-pub-cta">{{ download_label }} <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span>
        </a>
{% endfor %}
